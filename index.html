    <!-- JAVASCRIPT FOR FLOATING DIAMOND PARTICLES AND QR CODE -->
    <script>
        // Interactive Canvas Floating Diamond Crystal Particles
        const canvas = document.getElementById('sparkleCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class DiamondParticle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 12 + 8; // Size of diamond
                this.speedY = -(Math.random() * 0.4 + 0.15);
                this.speedX = (Math.random() - 0.5) * 0.25;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.02;
                this.opacity = Math.random() * 0.6 + 0.15;
                this.fade = Math.random() * 0.003 + 0.001;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotSpeed;
                this.opacity -= this.fade;
                if (this.opacity <= 0 || this.y < -20) {
                    this.reset();
                    this.y = canvas.height + 20;
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;

                const s = this.size;

                // Diamond Facet Drawing Paths
                ctx.beginPath();
                // Crown Top
                ctx.moveTo(-s * 0.5, -s * 0.3);
                ctx.lineTo(-s * 0.25, -s * 0.5);
                ctx.lineTo(s * 0.25, -s * 0.5);
                ctx.lineTo(s * 0.5, -s * 0.3);
                // Pavilion Bottom Tip
                ctx.lineTo(0, s * 0.5);
                ctx.closePath();

                // Gold Diamond Fill and Outer Line
                ctx.fillStyle = 'rgba(243, 218, 146, 0.2)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(212, 175, 55, 0.8)';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Inner Facet Reflection Lines
                ctx.beginPath();
                ctx.moveTo(-s * 0.5, -s * 0.3);
                ctx.lineTo(s * 0.5, -s * 0.3);
                ctx.moveTo(-s * 0.25, -s * 0.5);
                ctx.lineTo(0, s * 0.5);
                ctx.moveTo(s * 0.25, -s * 0.5);
                ctx.lineTo(0, s * 0.5);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.lineWidth = 0.75;
                ctx.stroke();

                ctx.restore();
            }
        }

        const diamondParticles = Array.from({ length: 28 }, () => new DiamondParticle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            diamondParticles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // QR CODE MODAL LOGIC
        let qrcodeObj = null;

        function openQRModal() {
            const modal = document.getElementById('qrModal');
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = ''; // Clear previous

            const pageUrl = window.location.href.startsWith('http') ? window.location.href : 'https://viraajdiamonds.com';

            qrcodeObj = new QRCode(qrContainer, {
                text: pageUrl,
                width: 170,
                height: 170,
                colorDark: "#5E4113",
                colorLight: "#FFFFFF",
                correctLevel: QRCode.CorrectLevel.H
            });

            modal.classList.remove('hidden');
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.add('hidden');
        }

        function downloadQRCode() {
            const img = document.querySelector('#qrcode img');
            if (img && img.src) {
                const link = document.createElement('a');
                link.href = img.src;
                link.download = 'Viraaj-Diamonds-QR.png';
                link.click();
            }
        }

        function printQRCode() {
            const img = document.querySelector('#qrcode img');
            if (img && img.src) {
                const win = window.open('', '_blank');
                win.document.write(`
                    <html>
                        <head>
                            <title>Print QR Code - Viraaj Diamonds</title>
                            <style>
                                body { font-family: 'Cinzel', serif; text-align: center; padding: 40px; background: #FAF7F2; }
                                h1 { color: #87620c; margin-bottom: 5px; }
                                p { color: #555; font-size: 14px; }
                                img { border: 4px solid #d4af37; padding: 10px; border-radius: 12px; margin-top: 20px; }
                            </style>
                        </head>
                        <body>
                            <h1>VIRAAJ DIAMONDS</h1>
                            <p>Fine Luxury Jewelry & Diamonds</p>
                            <img src="${img.src}" width="220" />
                            <script>window.onload = function() { window.print(); window.close(); }<\/script>
                        </body>
                    </html>
                `);
            }
        }
    </script>
